name: Build Flow APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name flow_game_optimizer --org com.egii.flow .

      - name: Install packages
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Flow-Game-Optimizer-APK
          path: build/app/outputs/flutter-apk/app-release.apk
