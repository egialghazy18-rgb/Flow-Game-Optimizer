name: Build Flow APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name flow_game_optimizer_v2 --org com.egii.flowv2 .
          rm -f test/widget_test.dart

      - name: Add native Game Library bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/kotlin/com/egii/flowv2/flow_game_optimizer_v2
          cat > android/app/src/main/kotlin/com/egii/flowv2/flow_game_optimizer_v2/MainActivity.kt <<'KOTLIN'
          package com.egii.flowv2.flow_game_optimizer_v2

          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.os.Build
          import android.util.Base64
          import android.graphics.Canvas
          import android.graphics.drawable.BitmapDrawable
          import android.graphics.drawable.Drawable
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.ByteArrayOutputStream

          class MainActivity : FlutterActivity() {
            private val channel = "com.egii.flow/games"

            override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
              super.configureFlutterEngine(flutterEngine)
              MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channel)
                .setMethodCallHandler { call, result ->
                  when (call.method) {
                    "getGames" -> {
                      try {
                        val pm = packageManager
                        val intent = Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LAUNCHER)
                        val list = if (Build.VERSION.SDK_INT >= 33) {
                          pm.queryIntentActivities(intent, PackageManager.ResolveInfoFlags.of(0L))
                        } else {
                          @Suppress("DEPRECATION")
                          pm.queryIntentActivities(intent, 0)
                        }
                        val own = packageName
                        val apps = list
                          .filter { it.activityInfo.packageName != own }
                          .distinctBy { it.activityInfo.packageName }
                          .map { info ->
                            val app = info.activityInfo.applicationInfo
                            mapOf(
                              "name" to info.loadLabel(pm).toString(),
                              "packageName" to app.packageName,
                              "icon" to drawableData(info.loadIcon(pm))
                            )
                          }
                          .sortedBy { (it["name"] as String).lowercase() }
                        result.success(apps)
                      } catch (e: Exception) {
                        result.error("LIST_FAILED", e.message, null)
                      }
                    }
                    "launchGame" -> {
                      val pkg = call.argument<String>("packageName")
                      if (pkg.isNullOrBlank()) {
                        result.error("BAD_PACKAGE", "Package name is empty", null)
                      } else {
                        try {
                          val launch = packageManager.getLaunchIntentForPackage(pkg)
                          if (launch == null) {
                            result.error("NOT_LAUNCHABLE", "No launch activity found", null)
                          } else if (Build.VERSION.SDK_INT >= 23 &&
                                     !android.provider.Settings.canDrawOverlays(this)) {
                            val permissionIntent = Intent(
                              android.provider.Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              android.net.Uri.parse("package:$packageName")
                            )
                            startActivity(permissionIntent)
                            result.error(
                              "OVERLAY_PERMISSION_REQUIRED",
                              "Aktifkan Display over other apps, lalu tekan Launch lagi.",
                              null
                            )
                          } else {
                            startService(Intent(this, FlowOverlayService::class.java))
                            launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                            startActivity(launch)
                            result.success(true)
                          }
                        } catch (e: Exception) {
                          result.error("LAUNCH_FAILED", e.message, null)
                        }
                      }
                    }
                    else -> result.notImplemented()
                  }
                }
            }

            private fun drawableData(drawable: Drawable): String? {
              return try {
                val bitmap = if (drawable is BitmapDrawable) drawable.bitmap else {
                  val width = if (drawable.intrinsicWidth > 0) drawable.intrinsicWidth else 96
                  val height = if (drawable.intrinsicHeight > 0) drawable.intrinsicHeight else 96
                  Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888).also {
                    val canvas = Canvas(it)
                    drawable.setBounds(0, 0, canvas.width, canvas.height)
                    drawable.draw(canvas)
                  }
                }
                val scaled = Bitmap.createScaledBitmap(bitmap, 96, 96, true)
                val out = ByteArrayOutputStream()
                scaled.compress(Bitmap.CompressFormat.PNG, 90, out)
                "data:image/png;base64," + Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP)
              } catch (_: Exception) { null }
            }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          start = s.find("<manifest")
          end = s.find(">", start)
          if start < 0 or end < 0:
              raise SystemExit("Tag <manifest> tidak ditemukan")
          for perm in (
              "android.permission.QUERY_ALL_PACKAGES",
              "android.permission.SYSTEM_ALERT_WINDOW",
          ):
              if perm not in s:
                  s = s[:end+1] + '\n    <uses-permission android:name="' + perm + '" />' + s[end+1:]
                  end = s.find(">", s.find("<manifest"))
          p.write_text(s)
          print("Izin manifest akan dipasang saat workflow berjalan.")
          PY

      - name: Add Flow overlay service
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp assets/flow_logo.jpg android/app/src/main/res/drawable-nodpi/flow_logo.jpg
          cat > android/app/src/main/kotlin/com/egii/flowv2/flow_game_optimizer_v2/FlowOverlayService.kt <<'KOTLIN'
          package com.egii.flowv2.flow_game_optimizer_v2

          import android.app.Service
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.widget.ImageView
          import android.os.Build
          import android.os.IBinder
          import android.os.SystemClock
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class FlowOverlayService : Service() {
            private lateinit var wm: WindowManager
            private var bubble: ImageView? = null
            private var panel: LinearLayout? = null
            private var focus = false
            private val startedAt = SystemClock.elapsedRealtime()

            override fun onBind(intent: Intent?): IBinder? = null

            override fun onCreate() {
              super.onCreate()
              if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this)) {
                stopSelf()
                return
              }
              wm = getSystemService(WINDOW_SERVICE) as WindowManager
              showBubble()
            }

            private fun windowType() =
              if (Build.VERSION.SDK_INT >= 26)
                WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
              else WindowManager.LayoutParams.TYPE_PHONE

            private fun layout(w: Int, h: Int, gravity: Int) =
              WindowManager.LayoutParams(
                w, h, windowType(),
                WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                PixelFormat.TRANSLUCENT
              ).apply { this.gravity = gravity }

            private fun showBubble() {
              if (bubble != null) return
              val v = ImageView(this).apply {
                val logoId = resources.getIdentifier("flow_logo", "drawable", packageName)
                if (logoId != 0) setImageResource(logoId)
                else setImageResource(android.R.drawable.ic_menu_view)
                scaleType = ImageView.ScaleType.FIT_CENTER
                setPadding(3, 3, 3, 3)
                background = GradientDrawable().apply {
                  shape = GradientDrawable.OVAL
                  setColor(Color.rgb(8, 13, 28))
                  setStroke(2, Color.rgb(0, 145, 255))
                }
                setOnClickListener {
                  if (panel == null) showPanel() else hidePanel()
                }
              }
              bubble = v
              val lp = layout(58, 58, Gravity.TOP or Gravity.START).apply {
                x = 20
                y = 180
              }
              v.setOnTouchListener(object : View.OnTouchListener {
                var downX = 0f
                var downY = 0f
                var startX = 0
                var startY = 0
                var dragging = false
                override fun onTouch(view: View, event: MotionEvent): Boolean {
                  val params = view.layoutParams as WindowManager.LayoutParams
                  when (event.action) {
                    MotionEvent.ACTION_DOWN -> {
                      downX = event.rawX
                      downY = event.rawY
                      startX = params.x
                      startY = params.y
                      dragging = false
                      return false
                    }
                    MotionEvent.ACTION_MOVE -> {
                      val dx = (event.rawX - downX).toInt()
                      val dy = (event.rawY - downY).toInt()
                      if (kotlin.math.abs(dx) > 8 || kotlin.math.abs(dy) > 8) dragging = true
                      if (dragging) {
                        params.x = startX + dx
                        params.y = startY + dy
                        wm.updateViewLayout(view, params)
                      }
                      return dragging
                    }
                  }
                  return false
                }
              })
              wm.addView(v, lp)
            }

            private fun hideBubble() {
              bubble?.let { try { wm.removeView(it) } catch (_: Exception) {} }
              bubble = null
            }

            private fun showPanel() {
              val blue = Color.rgb(0, 145, 255)
              val muted = Color.rgb(155, 174, 202)

              val root = LinearLayout(this).apply {
                orientation = LinearLayout.VERTICAL
                setPadding(18, 18, 18, 16)
                background = GradientDrawable().apply {
                  cornerRadius = 26f
                  setColor(Color.rgb(10, 15, 28))
                  setStroke(2, Color.rgb(28, 91, 166))
                }
              }

              fun label(value: String, size: Float, color: Int, bold: Boolean = false) =
                TextView(this).apply {
                  text = value
                  textSize = size
                  setTextColor(color)
                  if (bold) typeface = Typeface.DEFAULT_BOLD
                  setPadding(0, 3, 0, 3)
                }

              fun tile(title: String, value: String): LinearLayout =
                LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  setPadding(12, 10, 12, 10)
                  background = GradientDrawable().apply {
                    cornerRadius = 16f
                    setColor(Color.rgb(19, 29, 47))
                    setStroke(1, Color.rgb(36, 57, 85))
                  }
                  addView(label(title, 11f, muted, true))
                  addView(label(value, 17f, Color.WHITE, true))
                }

              fun action(title: String, primary: Boolean = false, onTap: () -> Unit) =
                TextView(this).apply {
                  text = title
                  textSize = 13f
                  gravity = Gravity.CENTER
                  typeface = Typeface.DEFAULT_BOLD
                  setTextColor(if (primary) Color.WHITE else Color.rgb(205, 222, 245))
                  setPadding(10, 13, 10, 13)
                  background = GradientDrawable().apply {
                    cornerRadius = 13f
                    setColor(if (primary) Color.rgb(0, 104, 220)
                             else Color.rgb(24, 35, 54))
                    setStroke(1, if (primary) blue else Color.rgb(48, 69, 98))
                  }
                  setOnClickListener { onTap() }
                }

              val header = LinearLayout(this).apply {
                orientation = LinearLayout.HORIZONTAL
                gravity = Gravity.CENTER_VERTICAL
              }
              val logo = ImageView(this).apply {
                val id = resources.getIdentifier("flow_logo", "drawable", packageName)
                if (id != 0) setImageResource(id)
                scaleType = ImageView.ScaleType.CENTER_CROP
                background = GradientDrawable().apply {
                  cornerRadius = 13f
                  setColor(Color.BLACK)
                }
              }
              header.addView(logo, LinearLayout.LayoutParams(56, 56))

              val titleBox = LinearLayout(this).apply {
                orientation = LinearLayout.VERTICAL
                setPadding(12, 0, 0, 0)
                addView(label("FLOW", 22f, Color.WHITE, true))
                addView(label("GAME BOOSTER", 11f, blue, true))
              }
              header.addView(titleBox, LinearLayout.LayoutParams(0, -2, 1f))
              header.addView(action("×") { hidePanel() },
                LinearLayout.LayoutParams(42, 42))
              root.addView(header)

              val divider = View(this).apply {
                setBackgroundColor(Color.rgb(35, 54, 81))
              }
              root.addView(divider, LinearLayout.LayoutParams(-1, 1).apply {
                topMargin = 14
                bottomMargin = 14
              })

              root.addView(label("SESI BERJALAN", 11f, muted, true))
              val timer = label("00:00:00", 30f, Color.WHITE, true)
              root.addView(timer)
              root.addView(label("Waktu sesi overlay", 12f, muted))

              val battery = registerReceiver(
                null, IntentFilter(Intent.ACTION_BATTERY_CHANGED)
              )
              val level = battery?.getIntExtra("level", -1) ?: -1
              val scale = battery?.getIntExtra("scale", -1) ?: -1
              val temp = battery?.getIntExtra("temperature", -1) ?: -1
              val pct = if (level >= 0 && scale > 0)
                "${level * 100 / scale}%" else "--"
              val tempText = if (temp >= 0)
                String.format("%.1f°C", temp / 10.0) else "--"

              val stats = LinearLayout(this).apply {
                orientation = LinearLayout.HORIZONTAL
                setPadding(0, 14, 0, 10)
              }
              stats.addView(tile("BATTERY", pct),
                LinearLayout.LayoutParams(0, -2, 1f).apply { marginEnd = 6 })
              stats.addView(tile("SUHU BATERAI", tempText),
                LinearLayout.LayoutParams(0, -2, 1f).apply { marginStart = 6 })
              root.addView(stats)

              val focusLabel = label(
                "●  MODE FOKUS  ·  ${if (focus) "AKTIF" else "NONAKTIF"}",
                12f, if (focus) blue else muted, true
              )
              root.addView(focusLabel)
              root.addView(label("FPS  ·  Belum tersedia", 12f, muted))

              root.addView(action(
                if (focus) "Matikan mode fokus" else "Aktifkan mode fokus", true
              ) {
                focus = !focus
                focusLabel.text =
                  "●  MODE FOKUS  ·  ${if (focus) "AKTIF" else "NONAKTIF"}"
                focusLabel.setTextColor(if (focus) blue else muted)
              }, LinearLayout.LayoutParams(-1, -2).apply {
                topMargin = 12
              })

              root.addView(action("BUKA FLOW") {
                packageManager.getLaunchIntentForPackage(packageName)?.let {
                  it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  startActivity(it)
                }
              }, LinearLayout.LayoutParams(-1, -2).apply { topMargin = 8 })

              val controls = LinearLayout(this).apply {
                orientation = LinearLayout.HORIZONTAL
              }
              controls.addView(action("Sembunyikan logo") {
                hideBubble()
              }, LinearLayout.LayoutParams(0, -2, 1f).apply { marginEnd = 4 })
              controls.addView(action("Tampilkan logo") {
                showBubble()
              }, LinearLayout.LayoutParams(0, -2, 1f).apply { marginStart = 4 })
              root.addView(controls, LinearLayout.LayoutParams(-1, -2).apply {
                topMargin = 8
              })

              root.addView(action("HENTIKAN FLOW") {
                stopSelf()
              }, LinearLayout.LayoutParams(-1, -2).apply {
                topMargin = 8
              })

              panel = root
              wm.addView(root, layout(
                320, WindowManager.LayoutParams.WRAP_CONTENT,
                Gravity.TOP or Gravity.END
              ).apply { x = 14; y = 100 })

              root.post(object : Runnable {
                override fun run() {
                  if (panel !== root) return
                  val sec = (SystemClock.elapsedRealtime() - startedAt) / 1000
                  timer.text = "Sesi: %02d:%02d:%02d".format(
                    sec / 3600, (sec % 3600) / 60, sec % 60
                  )
                  root.postDelayed(this, 1000)
                }
              })
            }

            private fun hidePanel() {
              panel?.let { try { wm.removeView(it) } catch (_: Exception) {} }
              panel = null
            }

            override fun onDestroy() {
              hidePanel()
              hideBubble()
              super.onDestroy()
            }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "FlowOverlayService" not in s:
              pos = s.find("</application>")
              if pos < 0:
                  raise SystemExit("Tag </application> tidak ditemukan")
              s = s[:pos] + '        <service android:name=".FlowOverlayService" android:exported="false" />' + chr(10) + '    ' + s[pos:]
          p.write_text(s)
          PY

      - name: Install packages
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Flow-Game-Optimizer-V2-APK
          path: build/app/outputs/flutter-apk/app-release.apk
